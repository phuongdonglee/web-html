const TEST="TEST_25";
let quiz=[],idx=0,correct=0,answered=false,mistakes=[],isTest=false;
const moduleSel=document.getElementById('module');
const modules=[...new Set(BANK.map(x=>x.module))];
moduleSel.innerHTML='<option value="ALL">Tất cả 6 module</option>'+modules.map(m=>`<option value="${m}">${m}</option>`).join('')+'<option value="'+TEST+'">★ TEST TỔNG HỢP – 25 CÂU</option>';
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeTest(){const quotas=[4,4,4,4,4,5];let result=[];modules.forEach((m,i)=>{let pool=shuffle(BANK.filter(x=>x.module===m));result.push(...pool.slice(0,quotas[i]))});return shuffle(result)}
function startQuiz(){isTest=moduleSel.value===TEST;let pool;if(isTest){quiz=makeTest()}else{pool=moduleSel.value==='ALL'?BANK:BANK.filter(x=>x.module===moduleSel.value);let n=Math.min(+document.getElementById('count').value,pool.length);quiz=shuffle(pool).slice(0,n)}idx=0;correct=0;answered=false;mistakes=[];document.getElementById('result').style.display='none';document.getElementById('testInfo').style.display=isTest?'block':'none';document.getElementById('testInfo').innerHTML=isTest?'★ <b>TEST 25 CÂU:</b> phân bổ đều theo 6 module: M1–M5 mỗi module 4 câu, M6 gồm 5 câu. Câu hỏi được chọn ngẫu nhiên mỗi lần làm test.':'';render()}
function render(){if(idx>=quiz.length)return finish();let x=quiz[idx];answered=false;document.getElementById('progress').textContent=`${idx+1}/${quiz.length}`;updateStats();document.getElementById('quiz').innerHTML=`<div class="card"><span class="tag">${x.module}</span><div class="small" style="margin-top:8px">Câu nguồn: ${x.orig}</div><div class="q">${idx+1}. ${x.q}</div><div id="opts">${x.options.map((o,i)=>`<label class="opt" id="o${i}"><input type="radio" name="a" onclick="choose(${i})"> <b>${'ABCD'[i]}.</b> ${o}</label>`).join('')}</div><div class="explain" id="explain"></div><div class="nav" style="margin-top:14px"><button onclick="prev()">← Câu trước</button><button class="primary" onclick="next()">Câu tiếp →</button></div></div>`}
function choose(sel){if(answered)return;answered=true;let x=quiz[idx];document.querySelectorAll('input[name=a]').forEach(e=>e.disabled=true);document.getElementById('o'+x.answer).classList.add('correct');if(sel===x.answer)correct++;else{document.getElementById('o'+sel).classList.add('wrong');mistakes.push({...x,selected:sel})}let e=document.getElementById('explain');e.style.display='block';e.innerHTML=sel===x.answer?`✓ Chính xác. Đáp án: <b>${'ABCD'[x.answer]}. ${x.options[x.answer]}</b>`:`✗ Chưa đúng. Đáp án đúng: <b>${'ABCD'[x.answer]}. ${x.options[x.answer]}</b>`;updateStats()}
function next(){if(!answered){alert('Hãy chọn một đáp án trước khi sang câu tiếp theo.');return}idx++;render()}function prev(){if(idx>0){idx--;render()}}function updateStats(){document.getElementById('right').textContent=correct;document.getElementById('wrong').textContent=mistakes.length;let done=correct+mistakes.length;document.getElementById('score').textContent=done?Math.round(correct/done*100)+'%':'0%'}
function finish(){document.getElementById('quiz').innerHTML='';let pct=quiz.length?Math.round(correct/quiz.length*100):0;let r=document.getElementById('result');r.style.display='block';r.innerHTML=`<h2>Kết quả: ${correct}/${quiz.length} câu đúng (${pct}%)</h2><p>${pct>=80?'Bạn đã nắm khá tốt phần này.':'Nên ôn lại các câu sai rồi làm lại một lượt.'}</p>${mistakes.length?'<h3>Các câu cần ôn lại</h3>'+mistakes.map((m,i)=>`<div class="review"><b>${i+1}. ${m.q}</b><br><span class="small">Bạn chọn: ${'ABCD'[m.selected]}. ${m.options[m.selected]} · Đúng: ${'ABCD'[m.answer]}. ${m.options[m.answer]}</span></div>`).join(''):'<p>Không có câu sai.</p>'}<button class="primary" style="margin-top:18px" onclick="startQuiz()">Làm đề mới</button>`;document.getElementById('progress').textContent=`${quiz.length}/${quiz.length}`;updateStats()}
startQuiz();
</script></body></html>
